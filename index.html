<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #18233b 0%, #090d18 70%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* Bintang */
.stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.7;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
}

/* Area bunga */
.scene {
    position: relative;
    width: 350px;
    height: 500px;
}

/* Tanah */
.ground {
    position: absolute;
    bottom: 55px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 12px;
    background: #182818;
    border-radius: 50%;
    filter: blur(2px);
}

/* Batang */
.stem {
    position: absolute;
    width: 7px;
    height: 0;
    background: linear-gradient(to right, #245b32, #4e9b52, #245b32);
    left: 50%;
    bottom: 60px;
    transform: translateX(-50%);
    border-radius: 10px;
    animation: growStem 4s ease-out forwards;
}

@keyframes growStem {
    0% {
        height: 0;
    }

    100% {
        height: 250px;
    }
}

/* Daun */
.leaf {
    position: absolute;
    width: 0;
    height: 0;
    background: #3f8d47;
    border-radius: 100% 0 100% 0;
    opacity: 0;
}

.leaf.left {
    left: 50%;
    bottom: 150px;
    transform-origin: right bottom;
    animation: leafLeft 2s ease-out 2s forwards;
}

.leaf.right {
    left: 50%;
    bottom: 190px;
    transform-origin: left bottom;
    border-radius: 0 100% 0 100%;
    animation: leafRight 2s ease-out 2.5s forwards;
}

@keyframes leafLeft {
    0% {
        width: 0;
        height: 0;
        opacity: 0;
        transform: rotate(0deg);
    }

    100% {
        width: 65px;
        height: 30px;
        opacity: 1;
        transform: translateX(-60px) rotate(-25deg);
    }
}

@keyframes leafRight {
    0% {
        width: 0;
        height: 0;
        opacity: 0;
        transform: rotate(0deg);
    }

    100% {
        width: 65px;
        height: 30px;
        opacity: 1;
        transform: translateX(0) rotate(25deg);
    }
}

/* Kepala bunga */
.flower {
    position: absolute;
    left: 50%;
    bottom: 300px;
    width: 20px;
    height: 20px;
    transform: translateX(-50%);
}

/* Kelopak */
.petal {
    position: absolute;
    width: 0;
    height: 0;
    left: 50%;
    top: 50%;
    background: linear-gradient(135deg, #ff719d, #d92869);
    border-radius: 100% 0 100% 0;
    transform-origin: bottom right;
    opacity: 0;
    box-shadow: 0 0 15px rgba(255, 70, 130, 0.4);
}

/* 8 kelopak */
.petal:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
.petal:nth-child(2) { transform: translate(-50%, -100%) rotate(45deg); }
.petal:nth-child(3) { transform: translate(-50%, -100%) rotate(90deg); }
.petal:nth-child(4) { transform: translate(-50%, -100%) rotate(135deg); }
.petal:nth-child(5) { transform: translate(-50%, -100%) rotate(180deg); }
.petal:nth-child(6) { transform: translate(-50%, -100%) rotate(225deg); }
.petal:nth-child(7) { transform: translate(-50%, -100%) rotate(270deg); }
.petal:nth-child(8) { transform: translate(-50%, -100%) rotate(315deg); }

.flower.bloom .petal {
    animation: bloom 3s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes bloom {
    0% {
        width: 0;
        height: 0;
        opacity: 0;
    }

    60% {
        opacity: 1;
    }

    100% {
        width: 95px;
        height: 135px;
        opacity: 1;
    }
}

/* Putik */
.center {
    position: absolute;
    width: 0;
    height: 0;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #ffe88a, #f5a623);
    box-shadow: 0 0 0 rgba(255, 210, 70, 0);
    z-index: 10;
    animation: centerGrow 3s ease-out 3s forwards;
}

@keyframes centerGrow {
    0% {
        width: 0;
        height: 0;
    }

    100% {
        width: 45px;
        height: 45px;
        box-shadow: 0 0 25px rgba(255, 200, 70, .7);
    }
}

/* Tulisan */
.message {
    position: absolute;
    width: 100%;
    text-align: center;
    bottom: 5px;
    color: white;
    font-size: 0;
    letter-spacing: 5px;
    opacity: 0;
    text-shadow: 0 0 15px rgba(255, 100, 160, .8);
    animation: showText 2s ease-out 6s forwards;
}

@keyframes showText {
    0% {
        opacity: 0;
        font-size: 0;
        transform: translateY(20px);
    }

    100% {
        opacity: 1;
        font-size: 36px;
        transform: translateY(0);
    }
}

/* Partikel cinta */
.heart {
    position: absolute;
    color: #ff6f9f;
    font-size: 15px;
    opacity: 0;
    animation: floatHeart 5s linear infinite;
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) scale(.5);
        opacity: 0;
    }

    20% {
        opacity: .8;
    }

    100% {
        transform: translateY(-180px) scale(1.2);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="scene">

    <div class="ground"></div>

    <div class="stem"></div>

    <div class="leaf left"></div>
    <div class="leaf right"></div>

    <div class="flower" id="flower">

        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>

        <div class="center"></div>

    </div>

    <div class="message">
        I Love You ❤️
    </div>

</div>

<script>

/* Membuat bintang */
const stars = document.getElementById("stars");

for (let i = 0; i < 80; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 2 + "s";

    stars.appendChild(star);
}


/* Mulai bunga mekar */
setTimeout(() => {

    document
        .getElementById("flower")
        .classList.add("bloom");

}, 3500);


/* Membuat hati beterbangan */
function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = "♥";

    heart.style.left =
        (40 + Math.random() * 20) + "%";

    heart.style.bottom =
        (100 + Math.random() * 80) + "px";

    heart.style.animationDuration =
        (3 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 700);

</script>

</body>
</html>
