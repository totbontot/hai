<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>For You 🌷</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        linear-gradient(
            to bottom,
            #101827 0%,
            #18263b 45%,
            #304a4d 72%,
            #101b16 100%
        );

    display: flex;
    justify-content: center;
    align-items: flex-end;

    font-family: Georgia, serif;
}

/* =========================
   LANGIT
========================= */

.sky {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(255,255,255,.8);
    border-radius: 50%;
    animation: blink 3s infinite alternate;
}

@keyframes blink {
    from {
        opacity: .15;
    }

    to {
        opacity: .9;
    }
}

/* =========================
   BULAN
========================= */

.moon {
    position: absolute;
    width: 55px;
    height: 55px;
    border-radius: 50%;

    background: #fff4cf;

    top: 9%;
    right: 12%;

    box-shadow:
        0 0 30px rgba(255,240,190,.35);
}

/* =========================
   TANAH
========================= */

.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 19%;

    background:
        linear-gradient(
            to top,
            #08100b,
            #142319
        );
}

/* =========================
   BUNGA
========================= */

.flower {
    position: absolute;

    bottom: 17%;
    left: 50%;

    width: 260px;
    height: 470px;

    transform: translateX(-50%);
}

/* =========================
   BATANG
========================= */

.stem {
    position: absolute;

    bottom: 0;
    left: 50%;

    width: 7px;
    height: 0;

    background:
        linear-gradient(
            to right,
            #183d25,
            #4d8b48,
            #214b29
        );

    border-radius: 100px;

    transform-origin: bottom center;
    transform: translateX(-50%) rotate(-2deg);

    animation:
        stemGrow 4s ease-out forwards;
}

@keyframes stemGrow {

    0% {
        height: 0;
    }

    100% {
        height: 330px;
    }
}

/* =========================
   DAUN
========================= */

.leaf {
    position: absolute;

    width: 75px;
    height: 34px;

    background:
        linear-gradient(
            135deg,
            #315f34,
            #579452
        );

    opacity: 0;

    transform-origin: right center;

    border-radius: 100% 0 100% 0;
}

.leaf.left {
    left: 91px;
    bottom: 125px;

    transform:
        rotate(-30deg)
        scale(0);

    animation:
        leafAppear 1.5s ease-out 2.4s forwards,
        leafWind 4s ease-in-out 5s infinite;
}

.leaf.right {
    left: 100px;
    bottom: 180px;

    transform-origin: left center;

    border-radius: 0 100% 0 100%;

    transform:
        rotate(28deg)
        scale(0);

    animation:
        leafAppearRight 1.5s ease-out 2.8s forwards,
        leafWindRight 4s ease-in-out 5s infinite;
}

@keyframes leafAppear {

    0% {
        opacity: 0;
        transform:
            rotate(-30deg)
            scale(0);
    }

    100% {
        opacity: 1;
        transform:
            rotate(-30deg)
            scale(1);
    }
}

@keyframes leafAppearRight {

    0% {
        opacity: 0;
        transform:
            rotate(28deg)
            scale(0);
    }

    100% {
        opacity: 1;
        transform:
            rotate(28deg)
            scale(1);
    }
}

@keyframes leafWind {

    0%,100% {
        transform: rotate(-30deg);
    }

    50% {
        transform: rotate(-24deg);
    }
}

@keyframes leafWindRight {

    0%,100% {
        transform: rotate(28deg);
    }

    50% {
        transform: rotate(34deg);
    }
}

/* =========================
   KEPALA BUNGA
========================= */

.flower-head {

    position: absolute;

    left: 50%;
    bottom: 325px;

    width: 32px;
    height: 38px;

    transform:
        translateX(-50%)
        rotate(-2deg);

    transform-origin: bottom center;

    animation:
        budGrow 3s ease-in-out 3.5s forwards,
        flowerSway 5s ease-in-out 7s infinite;
}

@keyframes budGrow {

    0% {
        width: 22px;
        height: 28px;
    }

    100% {
        width: 190px;
        height: 180px;
    }
}

@keyframes flowerSway {

    0%,100% {
        transform:
            translateX(-50%)
            rotate(-2deg);
    }

    50% {
        transform:
            translateX(-50%)
            rotate(3deg);
    }
}

/* =========================
   KELopak
========================= */

.petal {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    opacity: 0;

    background:
        radial-gradient(
            ellipse at 40% 30%,
            #ffb1c6 0%,
            #f56f9a 45%,
            #c92d61 100%
        );

    border-radius:
        75% 25% 70% 30% /
        70% 35% 65% 30%;

    transform-origin: 50% 90%;
}

/* posisi natural, tidak identik sempurna */

.p1 {
    transform:
        translate(-50%, -90%)
        rotate(-12deg);
    animation: petal1 2.5s ease-out 5.4s forwards;
}

.p2 {
    transform:
        translate(-50%, -90%)
        rotate(32deg);
    animation: petal2 2.5s ease-out 5.8s forwards;
}

.p3 {
    transform:
        translate(-50%, -90%)
        rotate(76deg);
    animation: petal3 2.5s ease-out 6.1s forwards;
}

.p4 {
    transform:
        translate(-50%, -90%)
        rotate(122deg);
    animation: petal4 2.5s ease-out 6.4s forwards;
}

.p5 {
    transform:
        translate(-50%, -90%)
        rotate(166deg);
    animation: petal5 2.5s ease-out 6.7s forwards;
}

.p6 {
    transform:
        translate(-50%, -90%)
        rotate(211deg);
    animation: petal6 2.5s ease-out 7s forwards;
}

.p7 {
    transform:
        translate(-50%, -90%)
        rotate(255deg);
    animation: petal7 2.5s ease-out 7.3s forwards;
}

.p8 {
    transform:
        translate(-50%, -90%)
        rotate(302deg);
    animation: petal8 2.5s ease-out 7.6s forwards;
}

/* variasikan ukuran tiap kelopak */

@keyframes petal1 {
    to {
        width: 72px;
        height: 105px;
        opacity: 1;
    }
}

@keyframes petal2 {
    to {
        width: 76px;
        height: 112px;
        opacity: 1;
    }
}

@keyframes petal3 {
    to {
        width: 69px;
        height: 102px;
        opacity: 1;
    }
}

@keyframes petal4 {
    to {
        width: 74px;
        height: 108px;
        opacity: 1;
    }
}

@keyframes petal5 {
    to {
        width: 70px;
        height: 100px;
        opacity: 1;
    }
}

@keyframes petal6 {
    to {
        width: 78px;
        height: 110px;
        opacity: 1;
    }
}

@keyframes petal7 {
    to {
        width: 71px;
        height: 106px;
        opacity: 1;
    }
}

@keyframes petal8 {
    to {
        width: 75px;
        height: 105px;
        opacity: 1;
    }
}

/* =========================
   PUTIK
========================= */

.center {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #ffeaa1 0%,
            #f4bd45 50%,
            #b87322 100%
        );

    z-index: 10;

    animation:
        centerAppear
        2s ease-out 8.2s forwards;
}

@keyframes centerAppear {

    0% {
        width: 0;
        height: 0;
    }

    100% {
        width: 42px;
        height: 42px;
        box-shadow:
            0 0 20px
            rgba(255,210,90,.45);
    }
}

/* =========================
   PESAN
========================= */

.message {

    position: absolute;

    left: 0;
    bottom: 5%;

    width: 100%;

    text-align: center;

    color: white;

    font-size: 30px;

    letter-spacing: 4px;

    opacity: 0;

    text-shadow:
        0 0 15px rgba(255,120,160,.8);

    animation:
        messageAppear
        2.5s ease-out 9.5s forwards;
}

@keyframes messageAppear {

    0% {
        opacity: 0;
        transform:
            translateY(20px)
            scale(.8);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================
   HATI
========================= */

.heart {

    position: absolute;

    color: #ff7da6;

    font-size: 14px;

    opacity: 0;

    pointer-events: none;

    animation:
        heartFloat
        5s linear forwards;
}

@keyframes heartFloat {

    0% {
        transform:
            translateY(0)
            scale(.5);

        opacity: 0;
    }

    20% {
        opacity: .7;
    }

    100% {
        transform:
            translateY(-180px)
            scale(1.1);

        opacity: 0;
    }
}

/* =========================
   HP KECIL
========================= */

@media (max-height: 650px) {

    .flower {
        transform:
            translateX(-50%)
            scale(.8);

        transform-origin:
            bottom center;
    }

    .message {
        font-size: 25px;
    }
}

@media (max-width: 360px) {

    .flower {
        transform:
            translateX(-50%)
            scale(.85);

        transform-origin:
            bottom center;
    }
}
</style>
</head>

<body>

<div class="sky" id="sky"></div>

<div class="moon"></div>

<div class="ground"></div>

<div class="flower">

    <div class="stem"></div>

    <div class="leaf left"></div>
    <div class="leaf right"></div>

    <div class="flower-head">

        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>

        <div class="center"></div>

    </div>

</div>

<div class="message">
    I Love You ❤️
</div>


<script>

/* =========================
   BINTANG
========================= */

const sky =
    document.getElementById("sky");

for (let i = 0; i < 70; i++) {

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 75 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    sky.appendChild(star);
}


/* =========================
   HATI TERBANG
========================= */

function createHeart() {

    const heart =
        document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = "♥";

    heart.style.left =
        (42 + Math.random() * 16) + "%";

    heart.style.bottom =
        (18 + Math.random() * 15) + "%";

    heart.style.animationDuration =
        (4 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 7000);
}


/* hati baru muncul setelah bunga mekar */

setTimeout(() => {

    setInterval(createHeart, 1000);

}, 9000);

</script>

</body>
</html>
